[project]
name = "recursiveops"
version = "0.1.0"
description = "RecursiveOps backend"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.23.0",
  "sqlmodel>=0.0.16",
  "alembic>=1.13.0",
  "httpx>=0.26.0",
  "PyYAML>=6.0.1",
  "psutil>=5.9.8",
  "APScheduler>=3.10.4",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.0.0",
  "python-jose[cryptography]>=3.3.0",
  "aiofiles>=23.2.1",
  "orjson>=3.9.15",
  "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
